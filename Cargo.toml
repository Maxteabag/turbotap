[package]
name = "turbotap"
version = "1.6.0"
edition = "2021"
description = "Fast, headless CLI and multi-step flow runner for physical iPhones over Wi-Fi via patched WebDriverAgent"
license = "MIT"
authors = ["Maxteabag"]
repository = "https://github.com/Maxteabag/turbotap"
homepage = "https://github.com/Maxteabag/turbotap"
readme = "README.md"
keywords = ["ios", "iphone", "webdriveragent", "automation", "ocr"]
categories = ["command-line-utilities", "development-tools::testing"]
include = ["src/**", "skills/**", "patches/**", "scripts/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[[bin]]
name = "turbotap"
path = "src/main.rs"

[lib]
name = "turbotap"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
blake2 = "0.10"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
fancy-regex = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
libloading = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "1"
unicode-normalization = "0.1"
zune-jpeg = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[profile.test]
opt-level = 1
