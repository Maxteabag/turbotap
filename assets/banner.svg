<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="turbotap — Headless iPhone automation over Wi-Fi">
  <defs>
    <!-- Deep obsidian card gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0D12"/>
      <stop offset="50%" stop-color="#10141D"/>
      <stop offset="100%" stop-color="#090B10"/>
    </linearGradient>

    <!-- Subtle top-lit ambient studio glow -->
    <radialGradient id="studioGlow" cx="0.24" cy="0.48" r="0.38">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B0D12" stop-opacity="0"/>
    </radialGradient>

    <!-- Card hairline border with top specular catchlight -->
    <linearGradient id="cardBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="40%" stop-color="#94A3B8" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Sculptural macOS squircle icon fill & rim -->
    <linearGradient id="iconFill" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#1E2534"/>
      <stop offset="50%" stop-color="#131823"/>
      <stop offset="100%" stop-color="#0B0E15"/>
    </linearGradient>
    <linearGradient id="iconRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="35%" stop-color="#93C5FD" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Luminous silver-to-ice-blue glyph gradients -->
    <linearGradient id="arcGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="arcGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="arcGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.14"/>
    </linearGradient>
    <radialGradient id="coreDot" cx="0.35" cy="0.32" r="0.68">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </radialGradient>

    <!-- Subtle metallic wordmark fill -->
    <linearGradient id="wordmarkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Ultra-subtle fine grid -->
    <pattern id="fineGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>

    <!-- Soft drop shadow for the squircle -->
    <filter id="iconShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <!-- Crisp glow for the touch core -->
    <filter id="coreGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card shell -->
  <rect x="1.5" y="1.5" width="1197" height="337" rx="22" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="336" rx="22" fill="url(#fineGrid)"/>
  <rect x="2" y="2" width="1196" height="336" rx="22" fill="url(#studioGlow)"/>

  <!-- Left sculptural squircle brand mark -->
  <g transform="translate(152, 86)" filter="url(#iconShadow)">
    <rect x="0" y="0" width="168" height="168" rx="38" fill="url(#iconFill)" stroke="url(#iconRim)" stroke-width="1.75"/>
    <!-- Subtle inner top highlight arc -->
    <rect x="2" y="2" width="164" height="164" rx="36.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>

    <!-- Kinetic touch-ripple + speed-wave emblem (no lightning bolt, no clipart) -->
    <!-- Outer trailing motion arc -->
    <path d="M 46 38 A 66 66 0 0 1 46 130" fill="none" stroke="url(#arcGrad3)" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Mid kinetic ripple arc -->
    <path d="M 68 48 A 50 50 0 0 1 68 120" fill="none" stroke="url(#arcGrad2)" stroke-width="8.5" stroke-linecap="round"/>
    <!-- Inner primary touch arc -->
    <path d="M 90 59 A 34 34 0 0 1 90 109" fill="none" stroke="url(#arcGrad1)" stroke-width="9.5" stroke-linecap="round"/>
    <!-- Tactile touch-point core -->
    <circle cx="116" cy="84" r="14" fill="url(#coreDot)" filter="url(#coreGlow)"/>
    <circle cx="116" cy="84" r="24" fill="none" stroke="#7DD3FC" stroke-opacity="0.28" stroke-width="1.5"/>
  </g>

  <!-- Typography block -->
  <g transform="translate(366, 0)">
    <text x="0" y="168" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="86" font-weight="700" letter-spacing="-3.2" fill="url(#wordmarkGrad)">turbotap</text>

    <text x="3" y="210" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="21" font-weight="400" letter-spacing="0.2" fill="#94A3B8">Headless iPhone automation over Wi-Fi</text>

    <!-- Subtle hairline spec pills -->
    <g transform="translate(2, 234)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="500">
      <rect x="0" y="0" width="136" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="68" y="20.5" text-anchor="middle" fill="#CBD5E1">4× WDA speed</text>

      <rect x="148" y="0" width="144" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="220" y="20.5" text-anchor="middle" fill="#CBD5E1">Parallel OCR</text>

      <rect x="304" y="0" width="188" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="398" y="20.5" text-anchor="middle" fill="#CBD5E1">Linux · macOS → iOS</text>
    </g>
  </g>
</svg>
