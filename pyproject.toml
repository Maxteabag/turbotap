[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turbotap"
version = "0.4.0"
description = "Fast, headless CLI and multi-step flow runner for physical iPhones over Wi-Fi via patched WebDriverAgent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Maxteabag" }]
keywords = ["ios", "iphone", "webdriveragent", "wda", "automation", "cli", "ai-agents", "ocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/Maxteabag/turbotap"
Repository = "https://github.com/Maxteabag/turbotap"
Issues = "https://github.com/Maxteabag/turbotap/issues"

[project.scripts]
turbotap = "turbotap.cli:main"

# skills/, patches/ and scripts/ stay at the repo root (npx skills add, readers) and
# ship inside the package as turbotap/{skills,patches,scripts}.
[tool.setuptools]
package-dir = { "" = "src", "turbotap.skills" = "skills", "turbotap.patches" = "patches", "turbotap.scripts" = "scripts" }
packages = ["turbotap", "turbotap.skills", "turbotap.skills.turbotap", "turbotap.patches", "turbotap.scripts"]

[tool.setuptools.package-data]
"turbotap.skills" = ["*/SKILL.md", "*/references/*", "*/scripts/*"]
"turbotap.skills.turbotap" = ["SKILL.md", "references/*", "scripts/*"]
"turbotap.patches" = ["*.patch"]
"turbotap.scripts" = ["*.sh"]
